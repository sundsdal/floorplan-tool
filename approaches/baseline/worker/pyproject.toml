[project]
name = "worker"
version = "0.1.0"
description = "LiveKit Gemini worker for guided floorplan capture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "livekit-agents[google]>=1.8.13,<2",
]

[project.scripts]
worker = "worker.agent:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
